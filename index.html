<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>REVERSE12 AI 도우미</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:#fff;color:#171717}.app{height:100dvh;display:flex}.side{width:250px;border-right:1px solid #eee;padding:18px 12px;background:#fafafa}.brand{font-weight:750;margin:4px 8px 18px}.new,.hist{width:100%;text-align:left;border:0;background:transparent;padding:10px;border-radius:10px}.new{border:1px solid #ddd;background:#fff}.hist:hover{background:#eee}.main{flex:1;display:flex;flex-direction:column;min-width:0}.top{height:48px;border-bottom:1px solid #f1f1f1;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:12px}.plan{border:1px solid #ddd;border-radius:20px;padding:6px 10px;background:#fff}.chat{flex:1;overflow:auto;padding:24px max(18px,calc((100% - 760px)/2))}.empty{height:100%;display:grid;place-items:center;text-align:center;color:#777}.empty strong{display:block;color:#222;font-size:22px;margin-bottom:7px}.composer{padding:10px max(12px,calc((100% - 800px)/2)) 18px}.box{border:1px solid #d8d8d8;border-radius:24px;padding:8px;box-shadow:0 3px 18px #0000000b;background:#fff}.box textarea{width:100%;border:0;outline:0;resize:none;min-height:48px;padding:10px;font:inherit}.actions{display:flex;align-items:center;gap:7px}.round{width:36px;height:36px;border:0;border-radius:50%;background:#f2f2f2;font-size:20px}.send{margin-left:auto;border:0;border-radius:18px;padding:9px 14px;background:#171717;color:#fff}.plusmenu{position:absolute;bottom:76px;background:#fff;border:1px solid #ddd;border-radius:14px;padding:7px;box-shadow:0 8px 30px #0002;display:none}.plusmenu.open{display:grid}.plusmenu button{border:0;background:#fff;text-align:left;padding:10px 14px;border-radius:8px}.plusmenu button:hover{background:#f3f3f3}.mic{position:fixed;right:24px;bottom:115px;width:43px;height:43px;border-radius:50%;border:1px solid #b8b8b8;background:#fff;box-shadow:0 5px 20px #0002;cursor:grab;z-index:10}.mic.listening{animation:pulse 1.15s infinite}@keyframes pulse{50%{box-shadow:0 0 0 10px #7772,0 5px 20px #0002}}.msg{max-width:82%;margin:12px 0;padding:12px 14px;border-radius:17px;white-space:pre-wrap}.user{margin-left:auto;background:#f1f1f1}.ai{background:#fff;border:1px solid #eee}.mobileMenu{display:none}@media(max-width:720px){.side{display:none}.mobileMenu{display:block}.chat{padding:18px 14px}.top{padding:0 10px}.msg{max-width:92%}}
</style></head><body><div class="app">
<aside class="side"><div class="brand">REVERSE12 AI 도우미</div><button class="new">＋ 새 대화</button><p style="font-size:11px;color:#888;padding:8px">최근 대화 · 파일</p><button class="hist">오늘 고객관리</button><button class="hist">홍보 이미지 제작</button><button class="hist">상담 기록 정리</button></aside>
<main class="main"><header class="top"><span><button class="mobileMenu">☰</button> REVERSE12 AI 도우미</span><button class="plan">무료 · 구독 서비스</button></header>
<section id="chat" class="chat"><div id="empty" class="empty"><div style="width:min(760px,100%)"><strong>고객관리부터 시작하세요</strong><span>말하거나 눌러서 바로 관리할 수 있습니다.</span>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px;text-align:left">
<button class="new quick" data-q="오늘 관리할 고객 보여줘">오늘 관리</button>
<button class="new quick" data-q="연락 예정 고객 보여줘">연락 예정</button>
<button class="new quick" data-q="미처리 고객 보여줘">미처리</button>
<button class="new quick" data-q="소비자 고객 보여줘">소비자</button>
<button class="new quick" data-q="사업자 고객 보여줘">사업자</button>
<button class="new quick" data-q="보류자 고객 보여줘">보류자</button>
</div>
<div style="margin-top:10px;border:2px solid #e0b34f;background:#fffaf0;border-radius:14px;padding:13px;text-align:left"><b>★ 소개받기</b><br><small>소개받은 사람은 꼭 등록하세요 · 다음 연락일과 함께 관리</small></div>
<div style="margin-top:10px;border:1px solid #e6e6e6;border-radius:14px;padding:13px;text-align:left"><b>고객 한 명 찾기</b><br><small>“김○○ 고객 찾아줘” · “지난 상담 기록 보여줘” · “다음 연락 언제야?”</small></div>
</div></div><div id="peoplePanel" style="max-width:760px;margin:14px auto 0;display:none"><div style="display:flex;gap:7px"><input id="peopleSearch" placeholder="고객 이름 · 연락처 검색" style="flex:1;padding:10px;border:1px solid #ddd;border-radius:10px"><button id="addPerson" class="new" style="width:auto">＋ 고객</button></div><div id="peopleList" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:7px;margin-top:9px"></div></div>
<div id="customerDesk" style="display:none;max-width:760px;margin:18px auto;border:1px solid #ddd;border-radius:16px;padding:16px;background:#fff">
<div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><div><b id="custName" style="font-size:21px">고객 관리대장</b><div id="custType" style="font-size:12px;color:#777">소비자 · 사업자 · 보류자</div></div><button onclick="customerDesk.style.display='none'" class="round">×</button></div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0"><button class="new">소비자</button><button class="new">사업자</button><button class="new">보류자</button></div>
<label>상담·관리 기록<textarea id="custMemo" style="width:100%;min-height:110px;margin-top:5px;border:1px solid #ddd;border-radius:10px;padding:10px" placeholder="직접 입력하거나 AI 마이크로 입력"></textarea></label>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"><label>다음 연락일<input id="custNext" type="date" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:9px"></label><label>일정/할 일<input id="custTask" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:9px" placeholder="전화 · 방문 · 상담"></label></div>
<div style="margin-top:12px;border:2px solid #e0b34f;background:#fffaf0;border-radius:13px;padding:12px"><b>★ 소개받기</b><input id="custReferral" style="width:100%;margin-top:7px;padding:10px;border:1px solid #e4c46e;border-radius:9px" placeholder="소개받은 사람 이름 · 연락처"><small style="display:block;margin-top:5px">소개받은 사람은 꼭 등록하고 다음 연락일을 정하세요.</small></div>
<div style="display:flex;gap:7px;margin-top:12px"><button id="recordConsult" class="new">◉ 상담 녹음</button><button id="voiceMemo" class="new">◉ 음성 입력</button><button id="saveCust" class="new">저장</button></div></div>
</section>
<div class="composer"><div class="box"><textarea id="q" placeholder="메시지를 입력하거나 말해 주세요"></textarea><div class="actions"><button id="plus" class="round">＋</button><div id="plusmenu" class="plusmenu"><button>📷 카메라</button><button>▧ 사진</button><button>📎 파일</button><button>◉ 라이브 영상</button><button>▣ 화면 공유</button><button>↗ 내보내기 · SNS</button></div><button id="voice" class="round">◉</button><button id="send" class="send">보내기</button></div></div></div>
</main></div><div id="micMenu" style="display:none;position:fixed;z-index:30;background:#fff;border:1px solid #ddd;border-radius:12px;padding:6px;box-shadow:0 8px 24px #0002"><button id="micHide" class="new">숨기기</button><button id="micOff" class="new">끄기</button><button id="micRemove" class="new">화면에서 제거</button><button id="micSmaller" class="new">더 작게</button><button id="micLarger" class="new">크게</button></div><button id="micRestore" style="display:none;position:fixed;right:6px;bottom:110px;z-index:30;border:1px solid #ddd;border-radius:14px;background:#fff;padding:6px 8px">AI</button><div id="navDock" style="position:fixed;left:10px;bottom:12px;z-index:20;display:flex;gap:6px"><button id="goHome" class="round" title="REVERSE12 홈">⌂</button><button id="goBack" class="round" title="이전">‹</button><button id="goNext" class="round" title="다음">›</button></div><button id="floatMic" class="mic" title="이동형 AI 마이크">◉</button>
<script>
const q=document.getElementById('q'),chat=document.getElementById('chat'),empty=document.getElementById('empty');
function add(text,cls){empty?.remove();let d=document.createElement('div');d.className='msg '+cls;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
let people=JSON.parse(localStorage.getItem('reverse12_people')||'[]');function renderPeople(filter=''){const p=document.getElementById('peoplePanel'),l=document.getElementById('peopleList');p.style.display='block';l.innerHTML='';people.filter(x=>(x.name+' '+(x.phone||'')+' '+(x.type||'')).includes(filter)).forEach((x,i)=>{let b=document.createElement('button');b.className='new';b.innerHTML='<b>'+x.name+'</b><small style="display:block">'+(x.type||'미분류')+' · '+(x.next||'일정 없음')+'</small>';b.onclick=()=>openPerson(i);l.appendChild(b)});if(!people.length)l.innerHTML='<div style="color:#888;padding:12px">등록된 고객이 없습니다. ＋ 고객으로 추가하세요.</div>'}function openPerson(i){let x=people[i];customerDesk.style.display='block';custName.textContent=x.name+' 관리대장';custType.textContent=x.type||'미분류';custMemo.value=x.memo||'';custNext.value=x.next||'';custTask.value=x.task||'';custReferral.value=x.referral||'';customerDesk.dataset.i=i}function answer(t){let s='REVERSE12 AI 도우미입니다. ';if(/오늘|일정|관리할/.test(t))s+='오늘 관리할 고객과 연락·상담·재연락 일정을 고객관리 데이터와 연결해 보여주는 기능입니다.';else if(/고객|소비자|사업자|보류|연락|미처리|소개/.test(t)){s+='고객 목록에서 조건에 맞는 사람을 확인하고 이름을 누르면 개인 관리대장이 열립니다.';renderPeople((t.match(/[가-힣]{2,4}(?= 고객)/)||[''])[0]);}else if(/이미지|홍보/.test(t))s+='이미지·홍보물 생성 기능은 AI 생성 서버 연결 후 이 대화창에서 요청하고 결과를 받을 수 있습니다.';else s+='질문과 답변, 고객관리, 일정, 파일과 이미지 작업을 이 대화방에서 연결하도록 설계되어 있습니다.';add(s,'ai')}
function navigateVoice(t){if(/홈(으로|화면)?|리버스.*홈/.test(t)){location.href=location.pathname;return true}if(/네이버/.test(t)){window.open('https://www.naver.com','_blank','noopener');add('네이버를 열었습니다. 왼쪽 아래 홈 버튼으로 REVERSE12 홈을 유지할 수 있습니다.','ai');return true}if(/카카오/.test(t)){window.open('https://www.kakao.com','_blank','noopener');add('카카오를 열었습니다. 왼쪽 아래 홈 버튼으로 REVERSE12 홈을 유지할 수 있습니다.','ai');return true}return false}
function send(){let t=q.value.trim();if(!t)return;add(t,'user');q.value='';if(navigateVoice(t))return;setTimeout(()=>answer(t),180)}
document.getElementById('send').onclick=send;document.querySelectorAll('.quick').forEach(b=>b.onclick=()=>{const k=b.dataset.q;peoplePanel.style.display='block';let f=people;if(k.includes('보류'))f=people.filter(x=>x.type==='보류자');else if(k.includes('연락 예정'))f=people.filter(x=>x.next);else if(k.includes('미처리'))f=people.filter(x=>!x.memo||!x.next);const l=peopleList;l.innerHTML='';f.forEach((x,i)=>{let real=people.indexOf(x),el=document.createElement('button');el.className='new';el.innerHTML='<b>'+x.name+'</b><small style="display:block">'+(x.type||'미분류')+' · '+(x.next||'일정 없음')+'</small>';el.onclick=()=>openPerson(real);l.appendChild(el)});if(k.includes('오늘')){q.value='오늘 관리할 고객 보여줘';send()}});q.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
document.getElementById('goHome').onclick=()=>location.href=location.pathname;document.getElementById('goBack').onclick=()=>{if(chat.children.length>1)chat.lastElementChild?.remove()};document.getElementById('goNext').onclick=()=>q.focus();document.getElementById('plus').onclick=()=>document.getElementById('plusmenu').classList.toggle('open');
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec;
function listen(){if(!SR){add('이 기기에서 음성입력을 지원하는 브라우저 연결이 필요합니다.','ai');return}rec=new SR();rec.lang='ko-KR';rec.interimResults=true;floatMic.classList.add('listening');rec.onresult=e=>{q.value=Array.from(e.results).map(x=>x[0].transcript).join('')};rec.onend=()=>floatMic.classList.remove('listening');rec.onresult=e=>{let spoken=Array.from(e.results).map(x=>x[0].transcript).join('');q.value=spoken;if(/입력|기록/.test(spoken)&&customerDesk.style.display==='block'){custMemo.value=(custMemo.value+' '+spoken.replace(/^(입력|기록)(해|해줘|하세요)?/,'')).trim()} };rec.start()}
document.getElementById('addPerson').onclick=()=>{let name=prompt('고객 이름');if(!name)return;let type=prompt('구분: 소비자 / 사업자 / 보류자','소비자')||'소비자';people.push({name,type,memo:'',next:''});localStorage.setItem('reverse12_people',JSON.stringify(people));renderPeople()};document.getElementById('peopleSearch').oninput=e=>renderPeople(e.target.value);document.getElementById('voice').onclick=listen;document.getElementById('voiceMemo').onclick=()=>{listen();setTimeout(()=>{document.getElementById('custMemo').value=q.value},1200)};document.getElementById('recordConsult').onclick=()=>add('상담 녹음은 마이크 권한과 저장 서버 연결 후 고객별 원본 음성으로 보존됩니다.','ai');document.getElementById('saveCust').onclick=()=>{let i=+customerDesk.dataset.i;if(Number.isInteger(i)&&people[i]){people[i].memo=custMemo.value;people[i].next=custNext.value;people[i].task=custTask.value;people[i].referral=custReferral.value;localStorage.setItem('reverse12_people',JSON.stringify(people));renderPeople()}add('고객 관리기록을 저장했습니다. ★ 소개받은 사람이 있다면 꼭 등록해 주세요.','ai')};const floatMic=document.getElementById('floatMic');let micEnabled=localStorage.getItem('reverse12_mic_enabled')!=='0';function showMic(v){floatMic.style.display=v?'block':'none';micRestore.style.display=v?'none':'block'}floatMic.onclick=e=>{if(!micEnabled)return;if(e.detail===1)listen()};floatMic.oncontextmenu=e=>{e.preventDefault();micMenu.style.display='grid';micMenu.style.left=Math.min(innerWidth-150,e.clientX)+'px';micMenu.style.top=Math.min(innerHeight-140,e.clientY)+'px'};document.getElementById('micHide').onclick=()=>{micMenu.style.display='none';showMic(false)};document.getElementById('micOff').onclick=()=>{micEnabled=false;localStorage.setItem('reverse12_mic_enabled','0');micMenu.style.display='none';showMic(false)};document.getElementById('micRemove').onclick=()=>{localStorage.setItem('reverse12_mic_hidden','1');micMenu.style.display='none';showMic(false)};function micSize(n){let v=Math.max(30,Math.min(58,(parseInt(localStorage.getItem('reverse12_mic_size'))||43)+n));localStorage.setItem('reverse12_mic_size',v);floatMic.style.width=v+'px';floatMic.style.height=v+'px'}document.getElementById('micSmaller').onclick=()=>micSize(-5);document.getElementById('micLarger').onclick=()=>micSize(5);micSize(0);document.getElementById('micRestore').onclick=()=>{micEnabled=true;localStorage.setItem('reverse12_mic_enabled','1');localStorage.removeItem('reverse12_mic_hidden');showMic(true)};if(localStorage.getItem('reverse12_mic_hidden')==='1'||!micEnabled)showMic(false);
let drag=false,ox=0,oy=0;floatMic.onpointerdown=e=>{drag=false;ox=e.clientX-floatMic.offsetLeft;oy=e.clientY-floatMic.offsetTop;floatMic.setPointerCapture(e.pointerId)};
floatMic.onpointermove=e=>{if(!floatMic.hasPointerCapture(e.pointerId))return;drag=true;floatMic.style.left=Math.max(0,Math.min(innerWidth-45,e.clientX-ox))+'px';floatMic.style.top=Math.max(48,Math.min(innerHeight-45,e.clientY-oy))+'px';floatMic.style.right='auto';floatMic.style.bottom='auto'};
</script></body></html>
