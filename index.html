<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:#fff;color:#171717}.app{height:100dvh;display:flex}.side{width:250px;border-right:1px solid #eee;padding:18px 12px;background:#fafafa}.brand{font-weight:750;margin:4px 8px 18px}.new,.hist{width:100%;text-align:left;border:0;background:transparent;padding:10px;border-radius:10px}.new{border:1px solid #ddd;background:#fff}.hist:hover{background:#eee}.main{flex:1;display:flex;flex-direction:column;min-width:0}.top{height:48px;border-bottom:1px solid #f1f1f1;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:12px}.plan{border:1px solid #ddd;border-radius:20px;padding:6px 10px;background:#fff}.chat{flex:1;overflow:auto;padding:24px max(18px,calc((100% - 760px)/2))}.empty{height:100%;display:grid;place-items:center;text-align:center;color:#777}.empty strong{display:block;color:#222;font-size:22px;margin-bottom:7px}.composer{padding:10px max(12px,calc((100% - 800px)/2)) 18px}.box{border:1px solid #d8d8d8;border-radius:24px;padding:8px;box-shadow:0 3px 18px #0000000b;background:#fff}.box textarea{width:100%;border:0;outline:0;resize:none;min-height:48px;padding:10px;font:inherit}.actions{display:flex;align-items:center;gap:7px}.round{width:36px;height:36px;border:0;border-radius:50%;background:#f2f2f2;font-size:20px}.send{margin-left:auto;border:0;border-radius:18px;padding:9px 14px;background:#171717;color:#fff}.plusmenu{position:absolute;bottom:76px;background:#fff;border:1px solid #ddd;border-radius:14px;padding:7px;box-shadow:0 8px 30px #0002;display:none}.plusmenu.open{display:grid}.plusmenu button{border:0;background:#fff;text-align:left;padding:10px 14px;border-radius:8px}.plusmenu button:hover{background:#f3f3f3}.mic{position:fixed;right:24px;bottom:115px;width:43px;height:43px;border-radius:50%;border:1px solid #b8b8b8;background:#fff;box-shadow:0 5px 20px #0002;cursor:grab;z-index:10}.mic.listening{animation:pulse 1.15s infinite}@keyframes pulse{50%{box-shadow:0 0 0 10px #7772,0 5px 20px #0002}}.msg{max-width:82%;margin:12px 0;padding:12px 14px;border-radius:17px;white-space:pre-wrap}.user{margin-left:auto;background:#f1f1f1}.ai{background:#fff;border:1px solid #eee}.mobileMenu{display:none}.quick{min-height:44px}.customer-title{font-size:14px;font-weight:700}.new{cursor:pointer}.new:focus,.round:focus,.send:focus{outline:2px solid #999;outline-offset:2px}@media(max-width:720px){.side{display:none}.mobileMenu{display:block}.chat{padding:12px 10px}.top{padding:0 10px}.msg{max-width:94%}.empty strong{font-size:19px}.quick{min-height:40px;padding:8px;font-size:13px}#customerDesk{margin:8px 0!important;padding:12px!important;border-radius:13px!important}#customerDesk input,#customerDesk select,#customerDesk textarea{font-size:16px}#customerDesk textarea{min-height:88px!important}#peoplePanel{margin-top:8px!important}#peopleList{grid-template-columns:repeat(2,minmax(0,1fr))!important}.composer{padding:7px 8px 10px}.box{border-radius:18px}.mic{width:38px;height:38px}.actions .round{width:34px;height:34px}}
</style></head><body><div class="app">
<aside class="side"><div class="brand">REVERSE12 AI 도우미</div><button class="new">＋ 새 대화</button><p style="font-size:11px;color:#888;padding:8px">최근 대화 · 파일</p><button class="hist">오늘 고객관리</button><button class="hist">홍보 이미지 제작</button><button class="hist">상담 기록 정리</button></aside>
<main class="main"><header class="top"><span><button class="mobileMenu">☰</button> REVERSE12 AI 도우미</span><button class="plan">무료 · 구독 서비스</button></header>
<section id="chat" class="chat"><div id="empty" class="empty"><div style="width:min(760px,100%)"><strong>고객관리부터 시작하세요</strong><span>말하거나 눌러서 바로 관리할 수 있습니다.</span>

</div></div><div id="peoplePanel" style="max-width:760px;margin:14px auto 0;display:none"><div id="summaryCards" style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px"></div><div id="typeCards" style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px"></div><div style="display:flex;gap:7px"><select id="statusFilter" style="padding:10px;border:1px solid #ddd;border-radius:10px"><option value="">전체상태</option><option>관리중</option><option>연락완료</option><option>재연락</option><option>보류</option><option>완료</option></select><select id="peopleSort" style="padding:10px;border:1px solid #ddd;border-radius:10px"><option value="urgent">긴급순</option><option value="name">이름순</option><option value="recent">최근관리순</option></select><input id="peopleSearch" placeholder="고객 이름 · 연락처 검색" style="flex:1;padding:10px;border:1px solid #ddd;border-radius:10px"><button id="addPerson" class="new" style="width:auto">＋ 고객</button><button id="exportPeople" class="new" style="width:auto">백업</button><button id="importPeople" class="new" style="width:auto">복원</button><input id="importFile" type="file" accept="application/json" hidden></div><div id="peopleList" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:7px;margin-top:9px"></div></div>

<div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><div><b id="custName" style="font-size:21px">고객 관리대장</b><span id="saveState" style="font-size:11px;color:#777;margin-left:6px">저장됨</span><div id="custType" style="font-size:12px;color:#777">소비자 · 사업자 · 보류자</div></div><button id="closeCustomer" class="round">×</button></div>
<div style="display:grid;grid-template-columns:2fr 1fr;gap:7px;margin:10px 0"><input id="custPhone" inputmode="tel" placeholder="전화번호" style="padding:10px;border:1px solid #ddd;border-radius:9px"><button id="callCust" class="new">전화</button></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0"><button class="new typeBtn" data-type="소비자">소비자</button><button class="new typeBtn" data-type="사업자">사업자</button><button class="new typeBtn" data-type="보류자">보류자</button></div>
<label>상담·관리 기록<textarea id="custMemo" style="width:100%;min-height:110px;margin-top:5px;border:1px solid #ddd;border-radius:10px;padding:10px" placeholder="직접 입력하거나 AI 마이크로 입력"></textarea></label>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"><label>다음 연락일<input id="custNext" type="date" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:9px"></label><div style="display:flex;gap:5px;margin-top:5px"><button type="button" id="nextToday" class="new">오늘</button><button type="button" id="nextTomorrow" class="new">내일</button><button type="button" id="nextWeek" class="new">7일 후</button></div><label>일정/할 일<input id="custTask" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:9px" placeholder="전화 · 방문 · 상담"></label></div>
<div style="margin-top:12px;border:2px solid #e0b34f;background:#fffaf0;border-radius:13px;padding:12px"><b>★ 소개받기</b><input id="custReferral" style="width:100%;margin-top:7px;padding:10px;border:1px solid #e4c46e;border-radius:9px" placeholder="소개받은 사람 이름 · 연락처"><small style="display:block;margin-top:5px">소개받은 사람은 꼭 등록하고 다음 연락일을 정하세요.</small></div>
<div style="margin-top:10px"><label>관리 상태<select id="custStatus" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:9px"><option>관리중</option><option>연락완료</option><option>재연락</option><option>보류</option><option>완료</option></select></label></div><div id="historyBox" style="margin-top:10px;border-top:1px solid #eee;padding-top:10px"><b>이전 관리기록</b><div id="historyList" style="max-height:160px;overflow:auto;font-size:13px;margin-top:6px"></div></div><div style="display:flex;gap:7px;margin-top:12px"><button id="recordConsult" class="new">◉ 상담 녹음</button><button id="voiceMemo" class="new">◉ 음성 입력</button><button id="saveCust" class="new">저장</button><button id="completeCust" class="new">오늘 관리완료</button><button id="deleteCust" class="new">고객 삭제</button><button id="newReferral" class="new">★ 소개 등록</button></div></div>
</section>
<div class="composer"><div class="box"><textarea id="q" placeholder="메시지를 입력하거나 말해 주세요"></textarea><div class="actions"><button id="plus" class="round">＋</button><div id="plusmenu" class="plusmenu"><button>📷 카메라</button><button>▧ 사진</button><button>📎 파일</button><button>◉ 라이브 영상</button><button>▣ 화면 공유</button><button>↗ 내보내기 · SNS</button></div><button id="voice" class="round">◉</button><button id="send" class="send">보내기</button></div></div></div>
</main></div><div id="micMenu" style="display:none;position:fixed;z-index:30;background:#fff;border:1px solid #ddd;border-radius:12px;padding:6px;box-shadow:0 8px 24px #0002"><button id="micHide" class="new">숨기기</button><button id="micOff" class="new">끄기</button><button id="micRemove" class="new">화면에서 제거</button><button id="micSmaller" class="new">더 작게</button><button id="micLarger" class="new">크게</button></div><button id="micRestore" style="display:none;position:fixed;right:6px;bottom:110px;z-index:30;border:1px solid #ddd;border-radius:14px;background:#fff;padding:6px 8px">AI</button><div id="navDock" style="position:fixed;left:10px;bottom:12px;z-index:20;display:flex;gap:6px"><button id="goHome" class="round" title="REVERSE12 홈">⌂</button><button id="goBack" class="round" title="이전">‹</button><button id="goNext" class="round" title="다음">›</button></div><button id="floatMic" class="mic" title="이동형 AI 마이크">◉</button>
<script>
const q=document.getElementById('q'),chat=document.getElementById('chat'),empty=document.getElementById('empty');
function add(text,cls){empty?.remove();let d=document.createElement('div');d.className='msg '+cls;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
let people=JSON.parse(localStorage.getItem('reverse12_people')||'[]');const guideKey='reverse12_guide_'+new Date().toDateString();if(!localStorage.getItem(guideKey)){setTimeout(()=>add('오늘 새 명단을 둘러보고 추가해 주세요. 연락할 고객과 ★ 소개받은 사람 등록도 확인해 주세요.','ai'),500);localStorage.setItem(guideKey,'1')}function safe(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function renderSummary(){const d=dueSummary(),types=[['소비자',people.filter(x=>x.type==='소비자').length],['사업자',people.filter(x=>x.type==='사업자').length],['보류자',people.filter(x=>x.type==='보류자').length]];typeCards.innerHTML=types.map(x=>'<button class="new" style="padding:7px"><b>'+x[1]+'</b><small style="display:block">'+x[0]+'</small></button>').join('');[...typeCards.children].forEach((b,i)=>b.onclick=()=>{const type=types[i][0];peopleList.innerHTML='';people.filter(x=>x.type===type).forEach(x=>{let idx=people.indexOf(x),el=document.createElement('button');el.className='new';el.innerHTML='<b>'+safe(x.name)+'</b><small style="display:block">'+safe(x.next||'일정 없음')+'</small>';el.onclick=()=>openPerson(idx);peopleList.appendChild(el)})});const cards=[['오늘',d.today.length],['지난 일정',d.over.length],['미처리',d.pending.length],['★ 소개',d.ref.length]];summaryCards.innerHTML=cards.map(x=>'<button class="new" style="padding:7px"><b>'+x[1]+'</b><small style="display:block">'+x[0]+'</small></button>').join('');[...summaryCards.children].forEach((b,i)=>b.onclick=()=>{let f=i===0?d.today:i===1?d.over:i===2?d.pending:d.ref;peopleList.innerHTML='';f.forEach(x=>{let idx=people.indexOf(x),el=document.createElement('button');el.className='new';el.innerHTML='<b>'+safe(x.name)+'</b><small style="display:block">'+safe(x.type||'미분류')+' · '+safe(x.next||'일정 없음')+'</small>';el.onclick=()=>openPerson(idx);peopleList.appendChild(el)})})}function renderPeople(filter=''){const p=document.getElementById('peoplePanel'),l=document.getElementById('peopleList');p.style.display='block';renderSummary();l.innerHTML='';let rows=people.filter(x=>(x.name+' '+(x.phone||'')+' '+(x.type||'')).includes(filter)&&(!statusFilter?.value||x.status===statusFilter.value));const sort=peopleSort?.value||'urgent';if(sort==='name')rows.sort((a,b)=>a.name.localeCompare(b.name,'ko'));else if(sort==='recent')rows.sort((a,b)=>(b.updated||b.created||'').localeCompare(a.updated||a.created||''));else rows.sort((a,b)=>{const an=a.next||'9999-12-31',bn=b.next||'9999-12-31';return an.localeCompare(bn)});rows.forEach((x,i)=>{let b=document.createElement('button');b.className='new';let late=x.next&&x.next<localDay(),needs=!x.memo||!x.next||late;b.innerHTML='<b>'+safe(x.name)+'</b><small style="display:block;'+(late?'color:#a33;font-weight:700':'')+'">'+safe(x.type||'미분류')+' · '+safe(x.next||'일정 없음')+(late?' · 지난 일정':'')+'</small><small style="display:block;color:#888">최근관리 '+safe(x.lastManaged||((x.updated||'').slice(0,10))||'없음')+'</small>'+(x.introducedBy?'<small style="display:block;color:#9a7318">★ '+safe(x.introducedBy)+' 소개</small>':'')+(needs?'<small style="display:inline-block;margin-top:4px;padding:2px 6px;border-radius:9px;background:#f6eeee;color:#9a3333">확인 필요</small>':'');b.onclick=()=>openPerson(i);l.appendChild(b)});if(!people.length)l.innerHTML='<div style="color:#888;padding:12px">등록된 고객이 없습니다. ＋ 고객으로 추가하세요.</div>'}function openPerson(i){let x=people[i];if(!x)return;customerDesk.style.display='block';custName.textContent=x.name+' 관리대장';custType.textContent=(x.type||'미분류')+' · 최근관리 '+(x.lastManaged||((x.updated||'').slice(0,10))||'없음');custPhone.value=x.phone||'';custMemo.value=localStorage.getItem('reverse12_draft_'+i)??(x.memo||'');saveState.textContent='저장됨';saveState.style.color='#777';custNext.value=x.next||'';custTask.value=x.task||'';custReferral.value=x.referral||'';custStatus.value=x.status||'관리중';historyList.innerHTML=(x.history||[]).slice().reverse().map(h=>'<div style="padding:7px 0;border-bottom:1px solid #eee"><b>'+new Date(h.at).toLocaleString()+'</b><br>'+safe(h.memo||'')+' · '+safe(h.status||'')+'</div>').join('')||'<small>아직 이전 기록이 없습니다.</small>';customerDesk.dataset.i=i}function speakGuide(msg){if(!('speechSynthesis'in window))return;const u=new SpeechSynthesisUtterance(msg);u.lang='ko-KR';speechSynthesis.cancel();speechSynthesis.speak(u)}let guided=sessionStorage.getItem('reverse12_guided');if(!guided){setTimeout(()=>{speakGuide('오늘 새 명단을 둘러보고 추가해 주세요. 연락할 고객도 확인해 주세요.');sessionStorage.setItem('reverse12_guided','1')},900)}function localDay(){const d=new Date(),z=d.getTimezoneOffset()*60000;return new Date(d-z).toISOString().slice(0,10)}function dueSummary(){const today=localDay();return {today:people.filter(x=>x.next===today),over:people.filter(x=>x.next&&x.next<today),pending:people.filter(x=>!x.next||!x.memo),ref:people.filter(x=>x.referral)}}function answer(t){let s='REVERSE12 AI 도우미입니다. ';const ds=dueSummary();if(/오늘.*(관리|연락)|관리할.*오늘/.test(t)){s+='오늘 연락 예정 '+ds.today.length+'명, 지난 일정 '+ds.over.length+'명, 미처리 '+ds.pending.length+'명입니다.';renderPeople();add(s,'ai');return}if(/소개.*(목록|사람|받)/.test(t)){s+='소개받기 기록이 있는 고객은 '+ds.ref.length+'명입니다.';renderPeople();add(s,'ai');return}if(/오늘|일정|관리할/.test(t))s+='오늘 관리할 고객과 연락·상담·재연락 일정을 고객관리 데이터와 연결해 보여주는 기능입니다.';else if(/고객|소비자|사업자|보류|연락|미처리|소개/.test(t)){s+='고객 목록에서 조건에 맞는 사람을 확인하고 이름을 누르면 개인 관리대장이 열립니다.';renderPeople((t.match(/[가-힣]{2,4}(?= 고객)/)||[''])[0]);}else if(/이미지|홍보/.test(t))s+='이미지·홍보물 생성 기능은 AI 생성 서버 연결 후 이 대화창에서 요청하고 결과를 받을 수 있습니다.';else s+='질문과 답변, 고객관리, 일정, 파일과 이미지 작업을 이 대화방에서 연결하도록 설계되어 있습니다.';add(s,'ai')}
function navigateVoice(t){if(/홈(으로|화면)?|리버스.*홈/.test(t)){location.href=location.pathname;return true}if(/네이버/.test(t)){window.open('https://www.naver.com','_blank','noopener');add('네이버를 열었습니다. 왼쪽 아래 홈 버튼으로 REVERSE12 홈을 유지할 수 있습니다.','ai');return true}if(/카카오/.test(t)){window.open('https://www.kakao.com','_blank','noopener');add('카카오를 열었습니다. 왼쪽 아래 홈 버튼으로 REVERSE12 홈을 유지할 수 있습니다.','ai');return true}return false}
function send(){let t=q.value.trim();if(!t)return;add(t,'user');q.value='';if(navigateVoice(t))return;setTimeout(()=>answer(t),180)}

document.getElementById('addPerson').onclick=()=>{let name=prompt('고객 이름');if(!name||!name.trim())return;name=name.trim();let existing=people.findIndex(p=>p.name===name);if(existing>=0){openPerson(existing);add('같은 이름의 고객이 있어 기존 관리대장을 열었습니다.','ai');return}let type=prompt('구분: 소비자 / 사업자 / 보류자','소비자')||'소비자';people.push({name,type,memo:'',next:'',task:'',referral:'',status:'관리중',history:[],created:new Date().toISOString()});localStorage.setItem('reverse12_people',JSON.stringify(people));renderPeople()};document.getElementById('peopleSearch').oninput=e=>renderPeople(e.target.value);document.getElementById('peopleSort').onchange=()=>renderPeople(peopleSearch.value);document.getElementById('statusFilter').onchange=()=>renderPeople(peopleSearch.value);document.getElementById('importPeople').onclick=()=>importFile.click();document.getElementById('importFile').onchange=async e=>{try{const a=JSON.parse(await e.target.files[0].text());if(Array.isArray(a)){people=a;localStorage.setItem('reverse12_people',JSON.stringify(people));renderPeople();add('고객 백업을 복원했습니다.','ai')}}catch{add('백업 파일을 확인해 주세요.','ai')}};document.getElementById('exportPeople').onclick=()=>{const blob=new Blob([JSON.stringify(people,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='REVERSE12-customer-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.getElementById('voice').onclick=listen;document.getElementById('voiceMemo').onclick=()=>{listen();setTimeout(()=>{document.getElementById('custMemo').value=q.value},1200)};let mediaRec,chunks=[];document.getElementById('recordConsult').onclick=async()=>{try{if(mediaRec&&mediaRec.state==='recording'){mediaRec.stop();recordConsult.textContent='◉ 상담 녹음';return}const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];mediaRec=new MediaRecorder(stream);mediaRec.ondataavailable=e=>chunks.push(e.data);mediaRec.onstop=()=>{const blob=new Blob(chunks,{type:mediaRec.mimeType}),url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='REVERSE12-consult-'+Date.now()+'.webm';a.click();stream.getTracks().forEach(t=>t.stop());add('상담 녹음을 저장했습니다. 고객 기록 메모와 다음 연락일도 함께 확인해 주세요.','ai')};mediaRec.start();recordConsult.textContent='■ 녹음 중지'}catch(e){add('마이크 권한을 허용하면 상담 녹음을 시작할 수 있습니다.','ai')}};document.getElementById('newReferral').onclick=()=>{const raw=custReferral.value.trim();if(!raw){custReferral.focus();return}const name=raw.split(/[ ,/]/)[0];if(name&&!people.some(x=>x.name===name)){people.push({name,type:'신규',memo:'소개받은 고객',next:'',task:'첫 연락',referral:'',status:'관리중',source:(people[+customerDesk.dataset.i]?.name||'소개')});localStorage.setItem('reverse12_people',JSON.stringify(people));renderPeople();add(name+'님을 소개받은 신규 고객으로 등록했습니다. 첫 연락 일정을 정해 주세요.','ai')}};function plusDay(n){let d=new Date();d.setDate(d.getDate()+n);let z=d.getTimezoneOffset()*60000;custNext.value=new Date(d-z).toISOString().slice(0,10)}document.getElementById('nextToday').onclick=()=>plusDay(0);document.getElementById('nextTomorrow').onclick=()=>plusDay(1);document.getElementById('nextWeek').onclick=()=>plusDay(7);document.querySelectorAll('.typeBtn').forEach(b=>b.onclick=()=>{let i=+customerDesk.dataset.i;if(!people[i])return;people[i].type=b.dataset.type;custType.textContent=b.dataset.type;if(b.dataset.type==='보류자')custStatus.value='보류';localStorage.setItem('reverse12_people',JSON.stringify(people));renderPeople()});['custPhone','custMemo','custNext','custTask','custReferral','custStatus'].forEach(id=>document.getElementById(id)?.addEventListener('input',()=>{saveState.textContent='입력 중 · 저장 필요';saveState.style.color='#a36b00'}));document.getElementById('custMemo').addEventListener('input',()=>{let i=customerDesk.dataset.i;if(i!=='')localStorage.setItem('reverse12_draft_'+i,custMemo.value)});document.getElementById('closeCustomer').onclick=()=>{if(saveState.textContent.includes('저장 필요')&&!confirm('저장하지 않은 입력이 있습니다. 관리대장을 닫을까요?'))return;customerDesk.style.display='none'};document.getElementById('callCust').onclick=()=>{let n=custPhone.value.replace(/[^0-9+]/g,'');if(n)location.href='tel:'+n;else add('전화번호를 먼저 입력해 주세요.','ai')};document.getElementById('completeCust').onclick=()=>{let i=+customerDesk.dataset.i;if(!people[i])return;people[i].lastManaged=localDay();people[i].status='연락완료';people[i].history=people[i].history||[];people[i].history.push({at:new Date().toISOString(),memo:'오늘 관리완료',status:'연락완료'});localStorage.setItem('reverse12_people',JSON.stringify(people));custStatus.value='연락완료';renderPeople();add('오늘 고객관리를 완료로 기록했습니다. ★ 소개받은 사람이 있다면 꼭 등록해 주세요.','ai')};document.getElementById('deleteCust').onclick=()=>{let i=+customerDesk.dataset.i;if(!people[i])return;if(confirm(people[i].name+' 고객을 삭제할까요?')){people.splice(i,1);localStorage.setItem('reverse12_people',JSON.stringify(people));customerDesk.style.display='none';renderPeople();add('고객을 삭제했습니다.','ai')}};document.getElementById('saveCust').onclick=()=>{let i=+customerDesk.dataset.i;if(Number.isInteger(i)&&people[i]){people[i].phone=custPhone.value.trim();people[i].memo=custMemo.value;localStorage.removeItem('reverse12_draft_'+i);people[i].next=custNext.value;people[i].task=custTask.value;people[i].referral=custReferral.value;people[i].status=custStatus.value;people[i].updated=new Date().toISOString();people[i].history=people[i].history||[];people[i].history.push({at:new Date().toISOString(),memo:custMemo.value,next:custNext.value,task:custTask.value,referral:custReferral.value,status:custStatus.value});if(custReferral.value.trim()){const rn=custReferral.value.trim().split(/[·,\/]/)[0].trim();if(rn&&!people.some(p=>p.name===rn)){people.push({name:rn,type:'신규',memo:'소개받기 등록',next:'',task:'연락하기',referral:'',status:'관리중',history:[],created:new Date().toISOString(),introducedBy:people[i].name})}}localStorage.setItem('reverse12_people',JSON.stringify(people));renderPeople();saveState.textContent='저장됨';saveState.style.color='#287a42'}add('고객 관리기록을 저장했습니다. ★ 소개받은 사람이 있다면 꼭 등록해 주세요.','ai');speakGuide('소개받은 사람이 있다면 꼭 등록해 주세요.')};const floatMic=document.getElementById('floatMic');let micEnabled=localStorage.getItem('reverse12_mic_enabled')!=='0';function showMic(v){floatMic.style.display=v?'block':'none';micRestore.style.display=v?'none':'block'}floatMic.onclick=e=>{if(!micEnabled)return;if(e.detail===1)listen()};floatMic.oncontextmenu=e=>{e.preventDefault();micMenu.style.display='grid';micMenu.style.left=Math.min(innerWidth-150,e.clientX)+'px';micMenu.style.top=Math.min(innerHeight-140,e.clientY)+'px'};document.getElementById('micHide').onclick=()=>{micMenu.style.display='none';showMic(false)};document.getElementById('micOff').onclick=()=>{micEnabled=false;localStorage.setItem('reverse12_mic_enabled','0');micMenu.style.display='none';showMic(false)};document.getElementById('micRemove').onclick=()=>{localStorage.setItem('reverse12_mic_hidden','1');micMenu.style.display='none';showMic(false)};function micSize(n){let v=Math.max(30,Math.min(58,(parseInt(localStorage.getItem('reverse12_mic_size'))||43)+n));localStorage.setItem('reverse12_mic_size',v);floatMic.style.width=v+'px';floatMic.style.height=v+'px'}document.getElementById('micSmaller').onclick=()=>micSize(-5);document.getElementById('micLarger').onclick=()=>micSize(5);micSize(0);document.getElementById('micRestore').onclick=()=>{micEnabled=true;localStorage.setItem('reverse12_mic_enabled','1');localStorage.removeItem('reverse12_mic_hidden');showMic(true)};if(localStorage.getItem('reverse12_mic_hidden')==='1'||!micEnabled)showMic(false);
let drag=false,ox=0,oy=0;floatMic.onpointerdown=e=>{drag=false;ox=e.clientX-floatMic.offsetLeft;oy=e.clientY-floatMic.offsetTop;floatMic.setPointerCapture(e.pointerId)};
