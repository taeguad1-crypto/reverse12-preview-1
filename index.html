<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>REVERSE12 AI 도우미</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:#fff;color:#171717}.app{height:100dvh;display:flex}.side{width:250px;border-right:1px solid #eee;padding:18px 12px;background:#fafafa}.brand{font-weight:750;margin:4px 8px 18px}.new,.hist{width:100%;text-align:left;border:0;background:transparent;padding:10px;border-radius:10px}.new{border:1px solid #ddd;background:#fff}.hist:hover{background:#eee}.main{flex:1;display:flex;flex-direction:column;min-width:0}.top{height:48px;border-bottom:1px solid #f1f1f1;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:12px}.plan{border:1px solid #ddd;border-radius:20px;padding:6px 10px;background:#fff}.chat{flex:1;overflow:auto;padding:24px max(18px,calc((100% - 760px)/2))}.empty{height:100%;display:grid;place-items:center;text-align:center;color:#777}.empty strong{display:block;color:#222;font-size:22px;margin-bottom:7px}.composer{padding:10px max(12px,calc((100% - 800px)/2)) 18px}.box{border:1px solid #d8d8d8;border-radius:24px;padding:8px;box-shadow:0 3px 18px #0000000b;background:#fff}.box textarea{width:100%;border:0;outline:0;resize:none;min-height:48px;padding:10px;font:inherit}.actions{display:flex;align-items:center;gap:7px}.round{width:36px;height:36px;border:0;border-radius:50%;background:#f2f2f2;font-size:20px}.send{margin-left:auto;border:0;border-radius:18px;padding:9px 14px;background:#171717;color:#fff}.plusmenu{position:absolute;bottom:76px;background:#fff;border:1px solid #ddd;border-radius:14px;padding:7px;box-shadow:0 8px 30px #0002;display:none}.plusmenu.open{display:grid}.plusmenu button{border:0;background:#fff;text-align:left;padding:10px 14px;border-radius:8px}.plusmenu button:hover{background:#f3f3f3}.mic{position:fixed;right:24px;bottom:115px;width:43px;height:43px;border-radius:50%;border:1px solid #b8b8b8;background:#fff;box-shadow:0 5px 20px #0002;cursor:grab;z-index:10}.mic.listening{animation:pulse 1.15s infinite}@keyframes pulse{50%{box-shadow:0 0 0 10px #7772,0 5px 20px #0002}}.msg{max-width:82%;margin:12px 0;padding:12px 14px;border-radius:17px;white-space:pre-wrap}.user{margin-left:auto;background:#f1f1f1}.ai{background:#fff;border:1px solid #eee}.mobileMenu{display:none}@media(max-width:720px){.side{display:none}.mobileMenu{display:block}.chat{padding:18px 14px}.top{padding:0 10px}.msg{max-width:92%}}
</style></head><body><div class="app">
<aside class="side"><div class="brand">REVERSE12 AI 도우미</div><button class="new">＋ 새 대화</button><p style="font-size:11px;color:#888;padding:8px">최근 대화 · 파일</p><button class="hist">오늘 고객관리</button><button class="hist">홍보 이미지 제작</button><button class="hist">상담 기록 정리</button></aside>
<main class="main"><header class="top"><span><button class="mobileMenu">☰</button> REVERSE12 AI 도우미</span><button class="plan">무료 · 구독 서비스</button></header>
<section id="chat" class="chat"><div id="empty" class="empty"><div><strong>무엇을 도와드릴까요?</strong><span>질문 · 고객관리 · 일정 · 이미지 · 홍보 제작</span></div></div></section>
<div class="composer"><div class="box"><textarea id="q" placeholder="메시지를 입력하거나 말해 주세요"></textarea><div class="actions"><button id="plus" class="round">＋</button><div id="plusmenu" class="plusmenu"><button>📷 카메라</button><button>▧ 사진</button><button>📎 파일</button><button>◉ 라이브 영상</button><button>▣ 화면 공유</button><button>↗ 내보내기 · SNS</button></div><button id="voice" class="round">◉</button><button id="send" class="send">보내기</button></div></div></div>
</main></div><button id="floatMic" class="mic" title="이동형 AI 마이크">◉</button>
<script>
const q=document.getElementById('q'),chat=document.getElementById('chat'),empty=document.getElementById('empty');
function add(text,cls){empty?.remove();let d=document.createElement('div');d.className='msg '+cls;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
function answer(t){let s='REVERSE12 AI 도우미입니다. ';if(/오늘|일정|관리할/.test(t))s+='오늘 관리할 고객과 연락·상담·재연락 일정을 고객관리 데이터와 연결해 보여주는 기능입니다.';else if(/고객|소비자|사업자|보류/.test(t))s+='소비자·사업자·보류자와 상담기록, 다음 연락일, ★소개받기를 한 고객 관리대장에서 찾도록 연결합니다.';else if(/이미지|홍보/.test(t))s+='이미지·홍보물 생성 기능은 AI 생성 서버 연결 후 이 대화창에서 요청하고 결과를 받을 수 있습니다.';else s+='질문과 답변, 고객관리, 일정, 파일과 이미지 작업을 이 대화방에서 연결하도록 설계되어 있습니다.';add(s,'ai')}
function send(){let t=q.value.trim();if(!t)return;add(t,'user');q.value='';setTimeout(()=>answer(t),180)}
document.getElementById('send').onclick=send;q.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
document.getElementById('plus').onclick=()=>document.getElementById('plusmenu').classList.toggle('open');
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec;
function listen(){if(!SR){add('이 기기에서 음성입력을 지원하는 브라우저 연결이 필요합니다.','ai');return}rec=new SR();rec.lang='ko-KR';rec.interimResults=true;floatMic.classList.add('listening');rec.onresult=e=>{q.value=Array.from(e.results).map(x=>x[0].transcript).join('')};rec.onend=()=>floatMic.classList.remove('listening');rec.start()}
document.getElementById('voice').onclick=listen;const floatMic=document.getElementById('floatMic');floatMic.onclick=listen;
let drag=false,ox=0,oy=0;floatMic.onpointerdown=e=>{drag=false;ox=e.clientX-floatMic.offsetLeft;oy=e.clientY-floatMic.offsetTop;floatMic.setPointerCapture(e.pointerId)};
floatMic.onpointermove=e=>{if(!floatMic.hasPointerCapture(e.pointerId))return;drag=true;floatMic.style.left=Math.max(0,Math.min(innerWidth-45,e.clientX-ox))+'px';floatMic.style.top=Math.max(48,Math.min(innerHeight-45,e.clientY-oy))+'px';floatMic.style.right='auto';floatMic.style.bottom='auto'};
</script></body></html>
